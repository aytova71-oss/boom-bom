<!doctype html>
<html lang="az"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOM BOM · Admin</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--card:#0e1d33;--bd:#223a5c;--tx:#eaf2ff;--mu:#8fa6c8;--pr:#3eb5ff;--er:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(30px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--bd)}
h2{font-size:18px;margin:0}
small,.muted{color:var(--mu);font-size:13px}
.hidden{display:none!important}
input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:#050c18;color:var(--tx);font:inherit;margin:6px 0}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--pr);color:#05263d;font-weight:700;margin-top:6px}
.btn.alt{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn.red{background:var(--er);color:#fff}
.row{display:flex;gap:10px}.row .btn{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:18px 8px;border-radius:14px;font-weight:600}
.tile.on{border-color:var(--pr);background:#12294a}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.sec h3{margin:0 0 6px;font-size:16px}
#profile{margin-top:10px;color:var(--mu)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:#1b2f4d;border:1px solid var(--bd);padding:12px 14px;border-radius:12px;display:none;z-index:9}
.gate{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:16px;text-align:center}
</style></head>
<body><main>
<header><h2>🛠️ BOM BOM · Admin</h2><small id="who"></small></header>

<section id="gate" class="gate"><p>Admin girişi</p><button class="btn" id="login">Google ilə daxil ol</button></section>

<section id="panel" class="hidden">
  <div style="margin-top:14px">
    <input id="pid" maxlength="9" placeholder="Oyunçu ID: ABCD-1234" autocomplete="off">
  </div>

  <div class="grid">
    <button class="tile" data-sec="sCheck">🔍 Oyunçunu yoxla</button>
    <button class="tile" data-sec="sTick">✅ Mavi tik</button>
    <button class="tile" data-sec="sAdm">🛡️ Admin nişanı</button>
    <button class="tile" data-sec="sMsg">💬 Mesaj göndər</button>
    <button class="tile" data-sec="sAdd">🪙 Jeton əlavə et</button>
    <button class="tile" data-sec="sDel">➖ Jeton sil</button>
  </div>

  <div id="sCheck" class="sec hidden">
    <h3>Oyunçunu yoxla</h3>
    <button class="btn" id="doCheck">Yoxla</button>
    <div id="profile"></div>
  </div>

  <div id="sTick" class="sec hidden">
    <h3>Mavi tik</h3>
    <div class="row"><button class="btn" id="tickOn">Ver</button><button class="btn alt" id="tickOff">Götür</button></div>
  </div>

  <div id="sAdm" class="sec hidden">
    <h3>Admin nişanı</h3>
    <div class="row"><button class="btn" id="admOn">Ver</button><button class="btn alt" id="admOff">Götür</button></div>
  </div>

  <div id="sMsg" class="sec hidden">
    <h3>Oyun daxili mesaj</h3>
    <textarea id="body" maxlength="500" placeholder="Mesaj"></textarea>
    <button class="btn" id="doMsg">Göndər</button>
  </div>

  <div id="sAdd" class="sec hidden">
    <h3>Jeton əlavə et</h3>
    <input id="addN" type="number" inputmode="numeric" min="1" max="1000000" placeholder="Jeton sayı">
    <input id="addNote" maxlength="200" placeholder="Qısa qeyd (istəyə bağlı)">
    <button class="btn" id="doAdd">Əlavə et</button>
  </div>

  <div id="sDel" class="sec hidden">
    <h3>Jeton sil</h3>
    <input id="delN" type="number" inputmode="numeric" min="1" max="1000000" placeholder="Silinəcək jeton sayı">
    <input id="delNote" maxlength="200" placeholder="Qısa qeyd (istəyə bağlı)">
    <button class="btn red" id="doDel">Sil</button>
  </div>

  <button class="btn alt" id="logout" style="margin-top:18px">Çıxış</button>
</section>
</main>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCkWAHogLmh-uuCMRtl3CjT1YAE90eyh2U",authDomain:"gizlimina.firebaseapp.com",projectId:"gizlimina",storageBucket:"gizlimina.firebasestorage.app",messagingSenderId:"545882517556",appId:"1:545882517556:web:f1dce30b0878e676605a61"});
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);
const TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const ADMIN_NAME='BOM BOM Admin';
let admin=null;

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function fmt(v){v=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);return v.length>4?v.slice(0,4)+'-'+v.slice(4):v}
$('pid').addEventListener('input',e=>e.target.value=fmt(e.target.value));
function getId(){const v=$('pid').value.trim();if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)){toast('Əvvəlcə ID yaz (format: ABCD-1234)');return null}return v}
function log(type,target,detail){return db.collection('adminLog').add({type,target,detail,uid:admin.uid,ts:TS()}).catch(()=>{})}

/* Düymələr: basanda açılır, təkrar basanda bağlanır */
const SECS=['sCheck','sTick','sAdm','sMsg','sAdd','sDel'];
document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{
  const id=t.dataset.sec,wasOpen=!$(id).classList.contains('hidden');
  SECS.forEach(s=>$(s).classList.add('hidden'));
  document.querySelectorAll('.tile').forEach(x=>x.classList.remove('on'));
  if(!wasOpen){$(id).classList.remove('hidden');t.classList.add('on')}
}));

/* Giriş */
$('login').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast(e.message));
$('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
  if(!u){admin=null;$('gate').classList.remove('hidden');$('panel').classList.add('hidden');$('who').textContent='';return}
  try{
    const d=await db.collection('admins').doc(u.uid).get();
    if(!d.exists||d.data().role!=='admin'){toast('Bu hesabın admin icazəsi yoxdur');await auth.signOut();return}
    admin=u;$('who').textContent=u.email||u.uid;
    $('gate').classList.add('hidden');$('panel').classList.remove('hidden');
  }catch(e){toast('İcazə yoxlanmadı: '+e.message)}
});

/* Oyunçunu yoxla */
$('doCheck').onclick=async()=>{
  const id=getId();if(!id)return;
  try{
    const [o,w,b]=await Promise.all([
      db.collection('playerOwners').doc(id).get(),
      db.collection('wallets').doc(id).get(),
      db.collection('playerBadges').doc(id).get()
    ]);
    const box=$('profile');
    if(!o.exists){box.textContent='Bu ID hələ oyunçu hesabına bağlanmayıb.';return}
    const bd=b.exists?b.data():{};
    box.textContent='ID: '+id+' · Hesab: aktiv · Bulud balansı: '+(w.exists?(w.data().balance||0):'hazırlanır')+' · Mavi tik: '+(bd.verified?'var':'yox')+' · Admin nişanı: '+(bd.admin?'var':'yox');
  }catch(e){toast(e.message)}
};

/* Nişanlar */
async function setBadge(field,val,label){
  const id=getId();if(!id)return;
  try{
    await db.collection('playerBadges').doc(id).set({[field]:val,by:admin.uid,ts:TS()},{merge:true});
    await log('badge',id,field+'='+val);
    toast(label+(val?' verildi':' götürüldü'));
  }catch(e){toast('Alınmadı: '+e.message)}
}
$('tickOn').onclick=()=>setBadge('verified',true,'Mavi tik');
$('tickOff').onclick=()=>setBadge('verified',false,'Mavi tik');
$('admOn').onclick=()=>setBadge('admin',true,'Admin nişanı');
$('admOff').onclick=()=>setBadge('admin',false,'Admin nişanı');

/* Mesaj */
$('doMsg').onclick=async()=>{
  const id=getId();if(!id)return;
  const body=$('body').value.trim();if(!body){toast('Mesaj yaz');return}
  try{
    await db.collection('inbox').doc(id).collection('items').add({kind:'dm',title:'💬 Admindən mesaj',body:body.slice(0,500),by:ADMIN_NAME,read:false,ts:TS()});
    $('body').value='';toast('Mesaj göndərildi');
  }catch(e){toast('Göndərilmədi: '+e.message)}
};

/* Jeton əlavə et / sil */
async function grant(sign,nId,noteId){
  const id=getId();if(!id)return;
  const n=Math.floor(Number($(nId).value));
  if(!(n>=1&&n<=1000000)){toast('Jeton sayı 1–1 000 000 aralığında olmalıdır');return}
  try{
    const o=await db.collection('playerOwners').doc(id).get();
    if(!o.exists){toast('Oyunçu ID-si tapılmadı və ya hələ buluda bağlanmayıb');return}
    await db.collection('grants').doc(id).collection('items').add({a:sign*n,msg:$(noteId).value.trim().slice(0,200),used:false,createdBy:admin.uid,by:ADMIN_NAME,ts:TS()});
    await log('jeton',id,(sign>0?'+':'-')+n);
    $(nId).value='';$(noteId).value='';
    toast(sign>0?'Jeton əlavə sorğusu göndərildi':'Jeton silmə sorğusu göndərildi');
  }catch(e){toast('Göndərilmədi: '+e.message)}
}
$('doAdd').onclick=()=>grant(1,'addN','addNote');
$('doDel').onclick=()=>grant(-1,'delN','delNote');
</script>
</body></html>
