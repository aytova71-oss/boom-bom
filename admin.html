<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOM BOM · Admin</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--card:#0e1d33;--bd:#223a5c;--tx:#eaf2ff;--mu:#8fa6c8;--pr:#3eb5ff;--er:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui;padding:env(safe-area-inset-top) 12px 30px}main{max-width:560px;margin:auto}header{position:sticky;top:0;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--bd);z-index:2;display:flex;justify-content:space-between;gap:10px}h2{font-size:18px;margin:0}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}input,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid var(--bd);background:#06121f;color:var(--tx);font:inherit;margin:6px 0}button{padding:11px 14px;border:0;border-radius:11px;background:var(--pr);color:#032;font-weight:700;margin:4px 4px 4px 0}button.alt{background:transparent;border:1px solid var(--bd);color:var(--tx)}small,.muted{color:var(--mu)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000d;padding:12px 16px;border-radius:12px;display:none;max-width:90vw}.hidden{display:none}.result{border-top:1px solid var(--bd);padding:10px 0;overflow-wrap:anywhere}
</style></head><body><main><header><h2>🛠️ BOM BOM · Admin</h2><small id="who"></small></header><section id="gate" class="card"><p>Admin girişi</p><button id="login">Google ilə daxil ol</button></section><section id="panel" class="hidden">
<div class="card"><h3>Oyunçu axtarışı və jeton</h3><input id="pid" maxlength="9" placeholder="Oyunçu ID: ABCD-1234"><button id="find">Oyunçunu yoxla</button><div id="profile" class="muted"></div></div>
<div class="card"><h3>🪙 Jeton göndər</h3><input id="tid" maxlength="9" placeholder="Oyunçu ID: ABCD-1234"><div class="row"><input id="amount" type="number" min="1" max="1000000" placeholder="Jeton sayı"><input id="msg" maxlength="200" placeholder="Qısa qeyd (istəyə bağlı)"></div><button id="send">Jeton göndər</button><p class="muted">Jeton server tərəfindən oyunçunun bulud balansına əlavə olunur. Oyunçu oyunu açanda balans yenilənir.</p></div>
<div class="card"><h3>💬 Oyun daxili mesaj</h3><input id="mid" maxlength="9" placeholder="Oyunçu ID"><textarea id="body" maxlength="500" placeholder="Mesaj"></textarea><button id="sendmsg">Mesaj göndər</button></div>
<div class="card"><button class="alt" id="logout">Çıxış</button><p class="muted">Bu panel yalnız Firestore admins kolleksiyasında role=admin olan hesablar üçündür.</p></div></section></main><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCkWAHogLmh-uuCMRtl3CjT1YAE90eyh2U",authDomain:"gizlimina.firebaseapp.com",projectId:"gizlimina",storageBucket:"gizlimina.firebasestorage.app",messagingSenderId:"545882517556",appId:"1:545882517556:web:f1dce30b0878e676605a61"});
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);let admin=null;
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}
function fmt(v){v=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);return v.length>4?v.slice(0,4)+'-'+v.slice(4):v}
['pid','tid','mid'].forEach(id=>$(id).addEventListener('input',e=>e.target.value=fmt(e.target.value)));
function valid(id){let v=$(id).value.trim();if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)){toast('ID formatı: ABCD-1234');return null}return v}
$('login').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast(e.message));
auth.onAuthStateChanged(async u=>{if(!u){admin=null;$('gate').classList.remove('hidden');$('panel').classList.add('hidden');return}try{let d=await db.collection('admins').doc(u.uid).get();if(!d.exists||d.data().role!=='admin'){toast('Bu hesabın admin icazəsi yoxdur');await auth.signOut();return}admin=u;$('who').textContent=u.email||u.uid;$('gate').classList.add('hidden');$('panel').classList.remove('hidden')}catch(e){toast('İcazə yoxlanmadı: '+e.message)}});
$('find').onclick=async()=>{let id=valid('pid');if(!id)return;try{let [o,w]=await Promise.all([db.collection('playerOwners').doc(id).get(),db.collection('wallets').doc(id).get()]);if(!o.exists){$('profile').textContent='Bu ID hələ oyunçu hesabına bağlanmayıb.';return}let owner=o.data().uid;$('profile').innerHTML='ID: <b>'+id+'</b><br>Hesab əlaqəsi: aktiv<br>Bulud jeton balansı: <b>'+(w.exists?(w.data().balance||0):'hazırlanır')+'</b>'; $('tid').value=id;$('mid').value=id}catch(e){toast(e.message)}};
$('send').onclick=async()=>{let id=valid('tid'),n=Math.floor(Number($('amount').value));if(!id)return;if(!(n>=1&&n<=1000000)){toast('Jeton sayı 1–1 000 000 aralığında olmalıdır');return}try{let owner=await db.collection('playerOwners').doc(id).get();if(!owner.exists){toast('Oyunçu ID-si tapılmadı və ya hələ buluda bağlanmayıb');return}await db.collection('grants').doc(id).collection('items').add({a:n,msg:$('msg').value.trim().slice(0,200),used:false,createdBy:admin.uid,by:(admin.displayName||admin.email||'Admin').slice(0,60),ts:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('adminLog').add({type:'jeton',target:id,detail:'+'+n,uid:admin.uid,ts:firebase.firestore.FieldValue.serverTimestamp()});toast('Jeton göndərildi. Oyunçu oyunu açanda balansına əlavə olunacaq.');$('amount').value='';$('msg').value=''}catch(e){toast('Göndərilmədi: '+e.message)}};
$('sendmsg').onclick=async()=>{let id=valid('mid'),body=$('body').value.trim();if(!id||!body)return toast('ID və mesaj daxil et');try{await db.collection('inbox').doc(id).collection('items').add({kind:'dm',title:'💬 Admindən mesaj',body:body.slice(0,500),by:admin.email||'Admin',read:false,ts:firebase.firestore.FieldValue.serverTimestamp()});toast('Mesaj göndərildi');$('body').value=''}catch(e){toast(e.message)}};
$('logout').onclick=()=>auth.signOut();
</script></body></html>
